name: 'default'
seed: 0
stage: "geo"
fp16: False
text: ""
negative: ""
test: False
save_mesh: True
guidance:
  name: sd
  vram_O: True
  sd_version: '2.1'
  hf_key: None
training:
  iters: 5000
  albedo_iters: 10000
  lr: 0.001
  min_lr: 1e-4
  ckpt: latest
  anneal_tex_reso: False
  optim: 'adan'
  train_face_ratio: 0.3
  eval_interval: 1
  workspace: "../data/tada"
  perpneg: False
  geo_loss: []
  sample_jaw_pose: False
  known_view_interval: 1
  known_view_noise_scale: 0.002
  lambda_rgb: 1000
  lambda_mask: 500
  lambda_normal: 1000
  lambda_depth: 10
  use_dpt: False
  # new params
  use_vsd: True
  use_anneal_t: True
  v_pred: True
  unet_lr: 0.0001
  warm_iters: 500
  K: 1 # 每一次q_unet更新执行K次
  K2: 1 # 每K2次iter执行一次q_unet更新
  t5_iter_percent: 0.5 # 这里是百分比，表示在50%的iters时开始使用模拟退火（暂时是tmax=500）的策略
  albedo_iters: 1000 # 使用albedo着色的迭代次数
  normal_iters: -1 # 使用normal着色的迭代次数
  normal: False # 是否启用normal着色
  no_textureless: False # 是否禁用textureless着色
  no_lambertian: False # 是否禁用lambertian着色
  p_textureless: 0 # textureless着色的概率
  backbone: "particle"
  uncond_p: 0.1 # 无条件pose训练的概率
  unet_bs: 1 # q_unet的batch_size
  q_scheduler_update_every_step: True # 是否在每个step更新q_unet的scheduler
data:
  h: 512
  w: 512
  H: 800
  W: 800
  near: 0.01
  far: 1000
  fovy_range: [50, 70]
  radius_range: [1.0, 1.2]
  default_fovy: 60
  default_polar: 90
#  fovy_range: [50, 51]
#  radius_range: [1.19, 1.2]
  default_radius: 1.1
  default_azimuth: 0
  phi_range: [-45, 45]
  theta_range: [0, 120]
  head_phi_range: [-30, 30]
  head_theta_range: [85, 95]
  angle_overhead: 30
  angle_front: 90
  dir_text: True
  jitter_pose: False
  uniform_sphere_rate: 0.
#  image: "images/xiaole_rgba.png"
#  image: "../data/tada/ablation_head/Cinderella/validation/ep0069_rgba.png"
  image: ''
model:
  mesh: ""
  tex_mlp: False
  geo_mlp: False
  skip_bg: True
  lock_tex: False
  lock_geo: False
  lock_beta: False
  lock_pose: True
  lock_expression: False
  albedo_res: 1024
  init_empty_tex: True
  replace_hands_eyes: True
  ssaa: 2
  # new params
  n_particles: 1
smpl:
  model_path: 'data/smpl_related/models'
  model_type: 'smpl_vitruvian'
  gender: 'neutral'
  use_face_contour: False
  vitruvian_angle: 25

